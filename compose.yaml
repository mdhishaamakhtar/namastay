services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: namastay
      POSTGRES_USER: namastay
      POSTGRES_PASSWORD: namastay
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  media:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: namastay
      RUSTFS_SECRET_KEY: namastay-local
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - media-data:/data

volumes:
  postgres-data:
  media-data:
