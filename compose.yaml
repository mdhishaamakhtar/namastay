services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: namastay
      POSTGRES_USER: namastay
      POSTGRES_PASSWORD: namastay
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
