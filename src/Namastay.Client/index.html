<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2B52B" />
    <title>Namastay: plan your India trip by swiping</title>
    <meta name="description" content="Swipe through places, food and experiences across India, and get a day-by-day itinerary made for you. Free, and written for first-time visitors." />
    <meta property="og:site_name" content="Namastay" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Namastay: plan your India trip by swiping" />
    <meta property="og:description" content="Swipe through places, food and experiences across India, and get a day-by-day itinerary made for you." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Namastay: swipe through India, get your trip." />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html { background: #fff8e6; }
      [data-returning] #app { visibility: hidden; }
    </style>
    <script>
      // A signed-in visitor has their own home, so the public one never shows for them.
      try {
        if (location.pathname === "/" && localStorage.getItem("namastay-signed-in") === "yes")
          document.documentElement.setAttribute("data-returning", "");
      } catch {}
    </script>
    <script>
      // Content arrives after the browser's own attempt to restore scroll on refresh,
      // so this keeps trying until the page is tall enough, and stops if the visitor scrolls.
      (function () {
        try {
          var key = function () { return "namastay-scroll:" + location.pathname; };
          addEventListener("pagehide", function () {
            sessionStorage.setItem(key(), String(scrollY));
          });
          var entry = performance.getEntriesByType("navigation")[0];
          var target = Number(sessionStorage.getItem(key()));
          if (!entry || entry.type !== "reload" || !target) return;
          history.scrollRestoration = "manual";
          var start = performance.now();
          var stopped = false;
          var stop = function () { stopped = true; history.scrollRestoration = "auto"; };
          ["wheel", "touchstart", "keydown"].forEach(function (name) {
            addEventListener(name, stop, { once: true, passive: true });
          });
          var settle = function () {
            if (stopped) return;
            scrollTo(0, target);
            var waited = performance.now() - start;
            if ((Math.abs(scrollY - target) < 2 && waited > 800) || waited > 5000) stop();
            else requestAnimationFrame(settle);
          };
          settle();
        } catch {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preload" href="/fonts/yatra-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mukta-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mukta-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mukta-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/build/App.js"></script>
  </body>
</html>
